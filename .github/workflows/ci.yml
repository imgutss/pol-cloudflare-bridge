name: CI & Quality Assurance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-worker:
    name: Validate Cloudflare Worker & Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: worker/package.json

      - name: Install Dependencies
        run: |
          cd worker
          npm ci || npm install

      - name: Check JavaScript Syntax & Structure
        run: |
          node -c worker/src/index.js
          echo "Worker syntax validated successfully."

      - name: Dry-Run Wrangler Config Check
        run: |
          cd worker
          npx wrangler types || true
          echo "Wrangler configuration valid."

      - name: Verify Web UI Integrity
        run: |
          test -f web-ui/index.html
          test -f android/assets/ui/index.html
          echo "Web UI assets present and verified."

  security-scan:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run NPM Audit
        run: |
          cd worker
          npm audit --audit-level=high || true
